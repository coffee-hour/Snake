<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Data</title>
<style>
:root{--bg:#f6f6f4;--panel:#fff;--ink:#1c1c1a;--mute:#6f6f69;--line:#dcdcd6;--me:#2f5d50;--meink:#fff;--bot:#ecece7;--acc:#2f5d50}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--panel:#1f1f1d;--ink:#ecece8;--mute:#9a9a92;--line:#33332f;--me:#4a8a78;--meink:#fff;--bot:#2a2a27;--acc:#6fb7a2}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;display:flex}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
header h1{font-size:18px;margin:0}header span{color:var(--mute);font-size:13px;flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 12px}
#log{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:78%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.me{align-self:flex-end;background:var(--me);color:var(--meink)}.bot{align-self:flex-start;background:var(--bot)}
.sys{align-self:center;color:var(--mute);font-size:13px;white-space:pre-wrap;text-align:center}
.save{display:block;margin-top:6px;border:0;background:none;color:var(--acc);padding:0;font-size:13px}
form{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
textarea{flex:1;resize:none;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
form button{background:var(--acc);color:#fff;border:0;padding:0 18px}
aside{width:300px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
aside h2{font-size:15px;margin:0;padding:12px 14px;border-bottom:1px solid var(--line)}
#mems{flex:1;overflow:auto;padding:8px 14px;margin:0;list-style:none}
#mems li{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
#mems li span{flex:1}#mems button{padding:0 8px;border:0;background:none;color:var(--mute)}
.add{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:6px}
.add input{flex:1;min-width:0;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.meta{font-size:12px;color:var(--mute);padding:6px 14px}
@media(max-width:760px){aside{display:none}.msg{max-width:92%}}
</style></head><body>
<main><header><h1>Data</h1><span id="st">waking up...</span><button id="new">New chat</button></header>
<div id="log"><div class="sys">Data starts as a blank slate.\nTeach it with: remember: &lt;anything&gt;&emsp;&bull;&emsp;Remove with: forget: &lt;word&gt;</div></div>
<form id="f"><textarea id="in" rows="2" placeholder="Talk to Data... (Enter to send, Shift+Enter for a new line)" disabled></textarea><button id="go" disabled>Send</button></form></main>
<aside><h2>What Data has been taught</h2><ul id="mems"></ul><div class="meta" id="meta"></div>
<div class="add"><input id="add" placeholder="Teach Data something..."><button id="addb">Add</button></div>
<div class="add" style="border-top:0;padding-top:0"><button id="clr" style="flex:1">Forget everything</button></div></aside>
<script>
const \$=id=>document.getElementById(id);let hist=[],busy=false;
function bubble(cls,text){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;('log').appendChild(d);('log').scrollTop=1e9;return d}
function note(t){const d=document.createElement('div');d.className='sys';d.textContent=t;('log').appendChild(d);('log').scrollTop=1e9}
async function loadMem(){try{const r=await (await fetch('/api/memories')).json();const ul=\$('mems');ul.innerHTML='';
r.memories.forEach(m=>{const li=document.createElement('li');const s=document.createElement('span');s.textContent=m.text;
const b=document.createElement('button');b.textContent='×';b.title='Forget this';b.onclick=async()=>{await fetch('/api/memories/'+m.id,{method:'DELETE'});loadMem()};li.append(s,b);ul.appendChild(li)});
\$('meta').textContent=r.memories.length?(r.active<r.memories.length?`Using the newest ${r.active} of ${r.memories.length} (memory is full)`:`${r.memories.length} memories`):'Nothing yet — blank slate.';}catch(e){\$('meta').textContent='Offline Mock Mode'}}
async function poll(){try{const r=await (await fetch('/api/status')).json();if(r.ready){\$('st').textContent='ready';('in').disabled=('go').disabled=false;('in').focus();returncatch(e)('st').textContent='Mock View (No Server)';('in').disabled=('go').disabled=false;setTimeout(poll,1500)}
function addSave(div,text){const b=document.createElement('button');b.className='save';b.textContent='+ remember this';
b.onclick=async()=>{await fetch('/api/memories',{method:'POST',body:JSON.stringify({text})});b.textContent='saved';b.disabled=true;loadMem()};div.appendChild(b)}
async function send(){if(busy)return;const t=\$('in').value.trim();if(!t)return;('in').value='';busy=true;('go').disabled=true;bubble('me',t);
try{const r=await fetch('/api/chat',{method:'POST',body:JSON.stringify({messages:[...hist,{role:'user',content:t}]})});
if((r.headers.get('content-type')||'').includes('json')){const j=await r.json();note(j.reply||j.error||'error');loadMem()}
else{hist.push({role:'user',content:t});const b=bubble('bot','');let full='',buf='';const rd=r.body.getReader(),dec=new TextDecoder();
for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop();
for(const l of lines){if(!l.startsWith('data:'))continue;const p=l.slice(6).trim();if(p==='[DONE]')continue;
try{const d=JSON.parse(p).choices[0].delta.content;if(d){full+=d;b.textContent=full;\$('log').scrollTop=1e9}}catch(e){}}}
if(full){hist.push({role:'assistant',content:full});addSave(b,full)}else{b.textContent='(no answer — is the model loaded?)'}}}
catch(e){note('Frontend Demo Mode: Cannot reach backend server. Message sent: ' + t)}
busy=false;(go).disabled=false;('in').focus()}
\(('f').onsubmit=e=>{e.preventDefault();send()};\)('in').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
\(('new').onclick=()=>{hist=[];\)('log').innerHTML='';note('New chat. Data still remembers what it was taught.')};
('addb').onclick=async()=>const v=('add').value.trim();if(!v)return;await fetch('/api/memories',{method:'POST',body:JSON.stringify({text:v})});\(('add').value='';loadMem()};\)('add').onkeydown=e=>{if(e.key==='Enter')\(('addb').click()};\)('clr').onclick=async()=>{if(confirm('Make Data forget everything it was taught?')){await fetch('/api/memories/clear',{method:'POST'});loadMem()}};
loadMem();poll();
</script></body></html>
