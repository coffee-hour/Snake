<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: #fff;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 24px;
      box-sizing: border-box;
      gap: 12px;
    }

    #hud {
      display: flex;
      gap: 24px;
      z-index: 20;
      pointer-events: none;
      font-size: 18px;
      font-weight: bold;
    }

    canvas {
      display: block;
      border: 5px solid #0f0;
      background: #000;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #overlay {
      position: fixed;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      background: rgba(0, 0, 0, 0.9);
      border: 2px solid #0f0;
      border-radius: 4px;
      padding: 26px 28px;
      text-align: center;
      transition: opacity 0.2s ease;
    }

    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    h1 {
      margin: 0;
      font-size: 36px;
      color: #0f0;
      text-transform: uppercase;
      font-weight: bold;
    }

    #overlay p {
      margin: 0;
      max-width: 360px;
      line-height: 1.5;
      color: #fff;
    }

    #start-button {
      appearance: none;
      border: 2px solid #0f0;
      background: #000;
      color: #0f0;
      border-radius: 0;
      padding: 12px 22px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    #start-button:hover {
      background: #0f0;
      color: #000;
    }

    #start-button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div id="hud">
    <div>SCORE: <span id="score">0</span></div>
    <div>BEST: <span id="best-score">0</span></div>
  </div>

  <canvas id="game-canvas"></canvas>

  <div id="overlay">
    <h1 id="overlay-title">SNAKE</h1>
    <p id="overlay-message">Use the arrow keys to move. Press Space to pause.</p>
    <button id="start-button">Start Game</button>
  </div>

  <script>
    const COLS = 26;
    const ROWS = 26;
    const EMPTY = 0;
    const SNAKE = 1;
    const FRUIT = 2;

    const LEFT = 0;
    const UP = 1;
    const RIGHT = 2;
    const DOWN = 3;

    const KEY_LEFT = 37;
    const KEY_UP = 38;
    const KEY_RIGHT = 39;
    const KEY_DOWN = 40;
    const KEY_SPACE = 32;
    const KEY_ENTER = 13;

    const BASE_MOVE_INTERVAL = 160;
    const MIN_MOVE_INTERVAL = 80;
    const SPEED_STEP = 5;

    let canvas, ctx, keystate, score, highScore, lastMoveTime, queuedDirection, gameState;
    let audioContext = null;

    const scoreEl = document.getElementById("score");
    const bestScoreEl = document.getElementById("best-score");
    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlay-title");
    const overlayMessage = document.getElementById("overlay-message");
    const startButton = document.getElementById("start-button");

    const grid = {
      width: null,
      height: null,
      _grid: null,

      init: function(d, c, r) {
        this.width = c;
        this.height = r;
        this._grid = [];

        for (let x = 0; x < c; x++) {
          this._grid[x] = [];
          for (let y = 0; y < r; y++) {
            this._grid[x][y] = d;
          }
        }
      },

      set: function(val, x, y) {
        this._grid[x][y] = val;
      },

      get: function(x, y) {
        return this._grid[x][y];
      }
    };

    const snake = {
      direction: null,
      last: null,
      _queue: null,

      init: function(d, x, y) {
        this.direction = d;
        this._queue = [];
        this.insert(x, y);
      },

      insert: function(x, y) {
        this._queue.unshift({ x, y });
        this.last = this._queue[0];
      },

      remove: function() {
        return this._queue.pop();
      }
    };

    function ensureAudio() {
      if (!audioContext) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          audioContext = new AudioCtx();
        }
      }

      if (audioContext && audioContext.state === "suspended") {
        audioContext.resume();
      }
    }

    function playTone(type) {
      if (!audioContext) return;

      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      if (type === "eat") {
        oscillator.type = "triangle";
        oscillator.frequency.setValueAtTime(640, audioContext.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(920, audioContext.currentTime + 0.08);
        gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.08, audioContext.currentTime + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.12);
      } else if (type === "gameover") {
        oscillator.type = "sawtooth";
        oscillator.frequency.setValueAtTime(220, audioContext.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(90, audioContext.currentTime + 0.22);
        gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.12, audioContext.currentTime + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.25);
      } else {
        oscillator.type = "square";
        oscillator.frequency.setValueAtTime(420, audioContext.currentTime);
        gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.04, audioContext.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.08);
      }

      oscillator.start();
      oscillator.stop(audioContext.currentTime + 0.26);
    }

    function getHighScore() {
      try {
        return Number(localStorage.getItem("snake-high-score")) || 0;
      } catch (e) {
        return 0;
      }
    }

    function saveHighScore() {
      try {
        localStorage.setItem("snake-high-score", String(highScore));
      } catch (e) {
        // Ignore if storage is unavailable.
      }
    }

    function updateHud() {
      scoreEl.textContent = String(score);
      bestScoreEl.textContent = String(highScore);
    }

    function setFood() {
      const empty = [];

      for (let x = 0; x < grid.width; x++) {
        for (let y = 0; y < grid.height; y++) {
          if (grid.get(x, y) === EMPTY) {
            empty.push({ x, y });
          }
        }
      }

      if (empty.length === 0) {
        return false;
      }

      const randpos = empty[Math.floor(Math.random() * empty.length)];
      grid.set(FRUIT, randpos.x, randpos.y);
      return true;
    }

    function startGame() {
      ensureAudio();
      score = 0;
      lastMoveTime = 0;
      queuedDirection = null;
      gameState = "playing";

      grid.init(EMPTY, COLS, ROWS);

      const sp = {
        x: Math.floor(COLS / 2),
        y: ROWS - 1
      };

      snake.init(UP, sp.x, sp.y);
      grid.set(SNAKE, sp.x, sp.y);
      setFood();

      overlay.classList.add("hidden");
      updateHud();
      playTone("start");
    }

    function setPausedState() {
      gameState = "paused";
      overlayTitle.textContent = "PAUSED";
      overlayMessage.textContent = "Press Space to resume, or use the button below.";
      startButton.textContent = "Resume";
      overlay.classList.remove("hidden");
    }

    function resumeGame() {
      if (gameState !== "paused") return;
      gameState = "playing";
      overlay.classList.add("hidden");
    }

    function endGame() {
      gameState = "gameover";

      if (score > highScore) {
        highScore = score;
        saveHighScore();
      }

      updateHud();
      overlayTitle.textContent = "GAME OVER";
      overlayMessage.textContent = "Final score: " + score + ". Press Enter or click below to play again.";
      startButton.textContent = "Play Again";
      overlay.classList.remove("hidden");
      playTone("gameover");
    }

    function handleDirectionInput(nextDirection) {
      if (gameState !== "playing") {
        return;
      }

      if (snake.direction === null) {
        snake.direction = nextDirection;
        return;
      }

      const oppositeDirection = (snake.direction + 2) % 4;
      if (nextDirection === oppositeDirection) {
        return;
      }

      if (queuedDirection === null || queuedDirection !== nextDirection) {
        queuedDirection = nextDirection;
      }
    }

    function moveSnake() {
      if (queuedDirection !== null) {
        const nextDir = queuedDirection;
        const oppositeDirection = (snake.direction + 2) % 4;

        if (nextDir !== oppositeDirection) {
          snake.direction = nextDir;
        }

        queuedDirection = null;
      }

      let nx = snake.last.x;
      let ny = snake.last.y;

      switch (snake.direction) {
        case LEFT:
          nx--;
          break;
        case UP:
          ny--;
          break;
        case RIGHT:
          nx++;
          break;
        case DOWN:
          ny++;
          break;
      }

      const hitWall = nx < 0 || nx > grid.width - 1 || ny < 0 || ny > grid.height - 1;
      const hitSelf = grid.get(nx, ny) === SNAKE;

      if (hitWall || hitSelf) {
        endGame();
        return;
      }

      if (grid.get(nx, ny) === FRUIT) {
        score++;

        if (score > highScore) {
          highScore = score;
          saveHighScore();
        }

        updateHud();
        playTone("eat");
        setFood();
      } else {
        const tail = snake.remove();
        grid.set(EMPTY, tail.x, tail.y);
      }

      grid.set(SNAKE, nx, ny);
      snake.insert(nx, ny);
      lastMoveTime = performance.now();
    }

    function update(currentTime) {
      if (gameState !== "playing") {
        return;
      }

      const interval = Math.max(MIN_MOVE_INTERVAL, BASE_MOVE_INTERVAL - (score * SPEED_STEP));

      if (currentTime - lastMoveTime > interval) {
        moveSnake();
      }
    }

    function draw() {
      const tw = canvas.width / grid.width;
      const th = canvas.height / grid.height;

      for (let x = 0; x < grid.width; x++) {
        for (let y = 0; y < grid.height; y++) {
          ctx.fillStyle = "#000";
          ctx.fillRect(x * tw, y * th, tw, th);

          switch (grid.get(x, y)) {
            case SNAKE:
              if (x === snake.last.x && y === snake.last.y) {
                ctx.fillStyle = "#0f0";
              } else {
                ctx.fillStyle = "#0a0";
              }
              ctx.fillRect(x * tw, y * th, tw, th);
              break;
            case FRUIT:
              ctx.fillStyle = "#f00";
              ctx.fillRect(x * tw, y * th, tw, th);
              break;
          }
        }
      }
    }

    function loop(currentTime) {
      update(currentTime);
      draw();
      window.requestAnimationFrame(loop);
    }

    function setupEvents() {
      document.addEventListener("keydown", function(evt) {
        const key = evt.keyCode || evt.which;

        if ([KEY_LEFT, KEY_UP, KEY_RIGHT, KEY_DOWN, KEY_SPACE].includes(key)) {
          evt.preventDefault();
        }

        if (key === KEY_SPACE) {
          if (gameState === "playing") {
            setPausedState();
          } else if (gameState === "paused") {
            resumeGame();
          }
          return;
        }

        if (key === KEY_ENTER && (gameState === "gameover" || gameState === "ready")) {
          startGame();
          return;
        }

        const directionMap = {
          [KEY_LEFT]: LEFT,
          [KEY_UP]: UP,
          [KEY_RIGHT]: RIGHT,
          [KEY_DOWN]: DOWN
        };

        if (Object.prototype.hasOwnProperty.call(directionMap, key)) {
          handleDirectionInput(directionMap[key]);
        }
      });

      startButton.addEventListener("click", function() {
        if (gameState === "paused") {
          resumeGame();
        } else {
          startGame();
        }
      });
    }

    function main() {
      canvas = document.getElementById("game-canvas");
      canvas.width = COLS * 20;
      canvas.height = ROWS * 20;
      ctx = canvas.getContext("2d");

      highScore = getHighScore();
      updateHud();
      keystate = {};
      gameState = "ready";
      overlayTitle.textContent = "SNAKE";
      overlayMessage.textContent = "Use the arrow keys to move. Press Space to pause.";
      startButton.textContent = "Start Game";
      overlay.classList.remove("hidden");
      setupEvents();
      window.requestAnimationFrame(loop);
    }

    main();
  </script>
</body>
</html>
