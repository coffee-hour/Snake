<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #111;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      border: 5px solid #009BFF;
      background: #0f0;
      box-shadow: 0 0 20px rgba(0, 155, 255, 0.4);
    }
  </style>
</head>
<body>
<script>
  const COLS = 26;
  const ROWS = 26;
  const EMPTY = 0;
  const SNAKE = 1;
  const FRUIT = 2;

  const LEFT = 0;
  const UP = 1;
  const RIGHT = 2;
  const DOWN = 3;

  const KEY_LEFT = 37;
  const KEY_UP = 38;
  const KEY_RIGHT = 39;
  const KEY_DOWN = 40;

  let canvas, ctx, keystate, frames, score;
  let lastMoveTime = 0;
  const MOVE_INTERVAL = 100;

  const grid = {
    width: null,
    height: null,
    _grid: null,

    init: function(d, c, r) {
      this.width = c;
      this.height = r;
      this._grid = [];

      for (let x = 0; x < c; x++) {
        this._grid[x] = [];
        for (let y = 0; y < r; y++) {
          this._grid[x][y] = d;
        }
      }
    },

    set: function(val, x, y) {
      this._grid[x][y] = val;
    },

    get: function(x, y) {
      return this._grid[x][y];
    }
  };

  const snake = {
    direction: null,
    last: null,
    _queue: null,

    init: function(d, x, y) {
      this.direction = d;
      this._queue = [];
      this.insert(x, y);
    },

    insert: function(x, y) {
      this._queue.unshift({ x, y });
      this.last = this._queue[0];
    },

    remove: function() {
      return this._queue.pop();
    }
  };

  function setFood() {
    const empty = [];

    for (let x = 0; x < grid.width; x++) {
      for (let y = 0; y < grid.height; y++) {
        if (grid.get(x, y) === EMPTY) {
          empty.push({ x, y });
        }
      }
    }

    if (empty.length === 0) {
      return;
    }

    const randpos = empty[Math.floor(Math.random() * empty.length)];
    grid.set(FRUIT, randpos.x, randpos.y);
  }

  function main() {
    canvas = document.createElement("canvas");
    canvas.width = COLS * 20;
    canvas.height = ROWS * 20;
    ctx = canvas.getContext("2d");

    document.body.appendChild(canvas);

    ctx.font = "12px Helvetica";
    frames = 10;
    keystate = {};

    document.addEventListener("keydown", function(evt) {
      const key = evt.keyCode || evt.which;

      if ([KEY_LEFT, KEY_UP, KEY_RIGHT, KEY_DOWN].includes(key)) {
        evt.preventDefault();
      }

      keystate[key] = true;
    });

    document.addEventListener("keyup", function(evt) {
      delete keystate[evt.keyCode];
    });

    init();
    loop();
  }

  function init() {
    score = 0;
    lastMoveTime = 0;

    grid.init(EMPTY, COLS, ROWS);

    const sp = {
      x: Math.floor(COLS / 2),
      y: ROWS - 1
    };

    snake.init(UP, sp.x, sp.y);
    grid.set(SNAKE, sp.x, sp.y);

    setFood();
  }

  function loop(currentTime) {
    update(currentTime);
    draw();
    window.requestAnimationFrame(loop);
  }

  function update(currentTime) {
    if (currentTime - lastMoveTime > MOVE_INTERVAL) {
      if (keystate[KEY_LEFT] && snake.direction !== RIGHT) {
        snake.direction = LEFT;
      }
      if (keystate[KEY_UP] && snake.direction !== DOWN) {
        snake.direction = UP;
      }
      if (keystate[KEY_RIGHT] && snake.direction !== LEFT) {
        snake.direction = RIGHT;
      }
      if (keystate[KEY_DOWN] && snake.direction !== UP) {
        snake.direction = DOWN;
      }

      let nx = snake.last.x;
      let ny = snake.last.y;

      switch (snake.direction) {
        case LEFT:
          nx--;
          break;
        case UP:
          ny--;
          break;
        case RIGHT:
          nx++;
          break;
        case DOWN:
          ny++;
          break;
      }

      const hitWall =
        nx < 0 || nx > grid.width - 1 ||
        ny < 0 || ny > grid.height - 1;

      const hitSelf = grid.get(nx, ny) === SNAKE;

      if (hitWall || hitSelf) {
        init();
        return;
      }

      if (grid.get(nx, ny) === FRUIT) {
        score++;
        setFood();
      } else {
        const tail = snake.remove();
        grid.set(EMPTY, tail.x, tail.y);
      }

      grid.set(SNAKE, nx, ny);
      snake.insert(nx, ny);
      lastMoveTime = currentTime;
    }
  }

  function draw() {
    const tw = canvas.width / grid.width;
    const th = canvas.height / grid.height;

    for (let x = 0; x < grid.width; x++) {
      for (let y = 0; y < grid.height; y++) {
        switch (grid.get(x, y)) {
          case EMPTY:
            ctx.fillStyle = "#00FF00";
            break;
          case SNAKE:
            ctx.fillStyle = "#008000";
            break;
          case FRUIT:
            ctx.fillStyle = "#FF0000";
            break;
        }
        ctx.fillRect(x * tw, y * th, tw, th);
      }
    }

    ctx.fillStyle = "#000";
    ctx.font = "bold 16px Arial";
    ctx.fillText("SCORE: " + score, 10, canvas.height - 10);
  }

  main();
</script>
</body>
</html>
